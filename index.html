function clearPromo(pi) {
  document.querySelectorAll('.qty-input[data-pi="'+pi+'"]').forEach(inp => {

    const row = document.getElementById('prow-'+pi+'-'+ii);
    row.classList.remove('has-qty');
    document.getElementById('plt-'+pi+'-'+ii).textContent = '';
    item.prices.forEach((pr, ti) => {
      const cell = document.getElementById('pcell-'+pi+'-'+ii+'-'+ti);
      if(cell) cell.classList.remove('tier-active');
    });
  });
  const warn = document.getElementById('warn-'+pi);
  warn.innerHTML = '';
  warn.className = 'warn';
  updateTotals();
}

function switchPromo(pi) {
  document.querySelectorAll('#promoTabs button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.promo-section').forEach(s=>s.classList.remove('active'));
  document.getElementById('ptab-'+pi).classList.add('active');
  document.getElementById('psec-'+pi).classList.add('active');
  activePromo = pi;
  updateTotals();
}

function getActivePrice(pi, ii) {
  const p = PROMOS[pi];
  const item = p.items[ii];
  // Calculate promo subtotal to determine tier
  let promoTotal = 0;
  document.querySelectorAll('.qty-input[data-pi="'+pi+'"]').forEach(inp => {
    const q = parseInt(inp.value)||0;
    const i2 = parseInt(inp.dataset.ii);
    if(q>0) promoTotal += q * PROMOS[pi].items[i2].prices[PROMOS[pi].items[i2].prices.length-1];
  });
  
  // Determine which tier based on total
  const tiers = p.tiers;
  const prices = item.prices;
  if(prices.length <= 2) return prices[prices.length-1]; // simple promo, use special price
  
  // For multi-tier: $500/$750/$1000/$2000 thresholds
  if(prices.length === 4) {
    if(promoTotal >= 2000) return prices[3];
    if(promoTotal >= 1000) return prices[2];
    if(promoTotal >= 500) return prices[1];
    return prices[0];
  }
  // 3 tiers: reg/$500/$750
  if(promoTotal >= 750) return prices[2];
  if(promoTotal >= 500) return prices[1];
  return prices[0];
}

function qtyChanged(input) {
  const pi = parseInt(input.dataset.pi);
  const ii = parseInt(input.dataset.ii);
  const pk = parseInt(input.dataset.pk);
  const prev = parseInt(input.dataset.prev)||0;
  let qty = parseInt(input.value)||0;
  
  // Snap to case-pack multiples, detecting direction
  if(qty > 0 && qty % pk !== 0) {
    if(qty > prev) {
      // Going UP — round up to next case
      qty = Math.ceil(qty/pk)*pk;
    } else {
      // Going DOWN — round down to previous case (or 0)
      qty = Math.floor(qty/pk)*pk;
    }
  }
  
  input.value = qty > 0 ? qty : '';
  input.dataset.prev = qty;
  
  const row = document.getElementById('prow-'+pi+'-'+ii);
  const ltEl = document.getElementById('plt-'+pi+'-'+ii);
  
  if(qty > 0) {
    row.classList.add('has-qty');
  } else {
    row.classList.remove('has-qty');
    ltEl.textContent = '';
  }
  
  recalcPromo(pi);
  updateTotals();
}

function recalcPromo(pi) {
  const p = PROMOS[pi];
  // First pass: compute raw total using promo pricing to determine best tier
  let rawTotal = 0;
  let skuCount = 0;
  const qtyMap = {};
  
  document.querySelectorAll('.qty-input[data-pi="'+pi+'"]').forEach(inp => {
    const q = parseInt(inp.value)||0;
    const ii = parseInt(inp.dataset.ii);
    qtyMap[ii] = q;
    if(q > 0) skuCount++;
  });
  
  // Calculate total at a given tier
  function totalAtTier(ti) {
    let t = 0;
    p.items.forEach((item, ii) => {
      const q = qtyMap[ii] || 0;
      if(q > 0) t += q * item.prices[Math.min(ti, item.prices.length-1)];
    });
    return t;
  }
  
  // Determine active tier — start at first promo tier (1), step up as thresholds are met
  // Use the current tier's pricing to check if the total crosses the next threshold
  let tierIdx = 1; // Always start at first promo tier, never regular
  
  if(p.tiers.length === 3) {
    // 3 tiers: Regular / $500+ / $750+
    // Check if total at tier 1 pricing crosses $750 → move to tier 2
    const t1 = totalAtTier(1);
    if(t1 >= 750) tierIdx = 2;
  } else if(p.tiers.length === 4) {
    // 4 tiers: Regular / $500 / $1,000 / $2,000
    // Step up through each threshold using current tier pricing
    const t1 = totalAtTier(1);
    if(t1 >= 2000) { tierIdx = 3; }
    else if(t1 >= 1000) {
      tierIdx = 2;
      // Check if tier 2 total still crosses $2,000
      if(totalAtTier(2) >= 2000) tierIdx = 3;
    } else { tierIdx = 1; }
  }
  // 2-tier promos: always tier 1 (Special)
  
  // Apply prices at active tier and highlight
  let actualTotal = 0;
  p.items.forEach((item, ii) => {
    const q = qtyMap[ii] || 0;
    const priceIdx = Math.min(tierIdx, item.prices.length-1);
    const price = item.prices[priceIdx];
    const lt = q * price;
    
    // Highlight active tier column
    item.prices.forEach((pr, ti) => {
      const cell = document.getElementById('pcell-'+pi+'-'+ii+'-'+ti);
      if(cell) {
        cell.classList.toggle('tier-active', ti === priceIdx && q > 0);
      }
    });
    
    const ltEl = document.getElementById('plt-'+pi+'-'+ii);
    if(q > 0) {
      ltEl.textContent = '$'+lt.toFixed(2);
      actualTotal += lt;
    } else {
      ltEl.textContent = '';
    }
  });
  
  // Check requirements and show current tier info
  const warn = document.getElementById('warn-'+pi);
  const warnings = [];
  if(actualTotal > 0 && actualTotal < p.min_order) {
    warnings.push('⚠ Order is $'+actualTotal.toFixed(2)+' — minimum is $'+p.min_order.toLocaleString());
  }
  if(p.min_skus && skuCount > 0 && skuCount < p.min_skus) {
    warnings.push('⚠ '+skuCount+' SKUs selected — minimum is '+p.min_skus);
  }
  // Show tier status for multi-tier promos
  if(actualTotal > 0 && p.tiers.length >= 3) {
    const currentTier = p.tiers[tierIdx];
    let nextTier = '';
    if(p.tiers.length === 3 && tierIdx === 1) {
      const need = 750 - actualTotal;
      if(need > 0) nextTier = ' — Add $'+need.toFixed(2)+' to reach '+p.tiers[2]+' pricing';
    } else if(p.tiers.length === 4 && tierIdx < 3) {
      const thresholds = [0, 500, 1000, 2000];
      const nextThresh = thresholds[tierIdx+1];
      const need = nextThresh - actualTotal;
      if(need > 0) nextTier = ' — Add $'+need.toFixed(2)+' to reach '+p.tiers[tierIdx+1]+' pricing';
    }
    warnings.push('✓ Current pricing: '+currentTier+nextTier);
  }
  warn.innerHTML = warnings.join('<br>');
  warn.className = 'warn' + (warnings.length ? ' show' : '');
  
  return { total: actualTotal, items: skuCount };
}

function updateTotals() {
  let grandTotal = 0;
  let grandItems = 0;
  let activeTotal = 0;
  
  PROMOS.forEach((p, pi) => {
    let ptotal = 0;
    document.querySelectorAll('.qty-input[data-pi="'+pi+'"]').forEach(inp => {
      const q = parseInt(inp.value)||0;
      if(q > 0) {
        grandItems++;
        const ii = parseInt(inp.dataset.ii);
        const lt = document.getElementById('plt-'+pi+'-'+ii);
        if(lt && lt.textContent) {
          ptotal += parseFloat(lt.textContent.replace('$',''));
        }
      }
    });
    grandTotal += ptotal;
    if(pi === activePromo) activeTotal = ptotal;
  });
  
  document.getElementById('activePromoTotal').textContent = '$'+activeTotal.toFixed(2);
  document.getElementById('grandTotal').textContent = '$'+grandTotal.toFixed(2);
  document.getElementById('totalItems').textContent = grandItems;
}

function filterPromos() {
  const q = document.getElementById('searchBox').value.toLowerCase().trim();
  PROMOS.forEach((p, pi) => {
    let vis = 0;
    p.items.forEach((item, ii) => {
      const row = document.getElementById('prow-'+pi+'-'+ii);
      const match = !q || row.dataset.search.includes(q);
      row.style.display = match ? '' : 'none';
      if(match) vis++;
    });
    if(q) {
      document.getElementById('psec-'+pi).classList.toggle('active', vis > 0);
    }
  });
  if(!q) {
    document.querySelectorAll('.promo-section').forEach(s=>s.classList.remove('active'));
    document.getElementById('psec-'+activePromo).classList.add('active');
  }
}

function getOrderData() {
  const dealer = '';
  const po = document.getElementById('poNumber').value||'';
  const shipDate = document.getElementById('shipDate').value||'';
  const promoOrders = [];
  let grandTotal = 0, grandItems = 0;
  
  PROMOS.forEach((p, pi) => {
    const ordered = [];
    let ptotal = 0;
    document.querySelectorAll('.qty-input[data-pi="'+pi+'"]').forEach(inp => {
      const q = parseInt(inp.value)||0;
      if(q > 0) {
        const ii = parseInt(inp.dataset.ii);
        const item = p.items[ii];
        const lt = parseFloat(document.getElementById('plt-'+pi+'-'+ii).textContent.replace('$',''))||0;
        ordered.push({...item, qty:q, lineTotal:lt, unitPrice: lt/q});
        ptotal += lt;
      }
    });
    if(ordered.length > 0) {
      promoOrders.push({code:p.code, name:p.name, valid:p.valid, min_order:p.min_order, cs:p.cs,
        min_skus:p.min_skus, dating:p.dating, items:ordered, subtotal:ptotal});
      grandTotal += ptotal;
      grandItems += ordered.length;
    }
  });
  return {dealer, po, shipDate, promoOrders, grandTotal, grandItems};
}

function prepPrint() {
  let hasAny = false;
  PROMOS.forEach((p, pi) => {
    let hasOrders = false;
    document.querySelectorAll('.qty-input[data-pi="'+pi+'"]').forEach(inp => {
      if(parseInt(inp.value)>0) hasOrders = true;
    });
    document.getElementById('psec-'+pi).classList.toggle('has-orders', hasOrders);
    if(hasOrders) hasAny = true;
  });
  if(!hasAny) { alert('No items ordered.'); return; }
  window.print();
}

function exportExcel() {
  const data = getOrderData();
  if(data.grandItems===0){alert('No items ordered.');return;}
  
  const wb = XLSX.utils.book_new();
  
  data.promoOrders.forEach(po => {
    const rows = [
      ['Blish-Mize Fall 2026 Drop Ship Order'],
      ['Promo Code:', po.code, 'Program:', po.name],
      ['PO#:', data.po, 'Ship Date:', data.shipDate],
      ['Billing:', 'Through Blish-Mize', 'Valid:', po.valid, 'Dating:', po.dating],
      ['Min Order:', '$'+po.min_order],
      [po.code, po.cs?po.cs.t2:'', po.cs?po.cs.cond:'', po.cs?po.cs.must:''],
      ['Offer Valid:', po.valid, po.cs?po.cs.rsvd:'', 'Note: Coop/Distributor adders may apply. PaintCare Fees may apply'],
      [],
      ['Mfg#','Whse#','Description','Case Pack','Unit Price','Qty','Line Total'],
    ];
    po.items.forEach(item => {
      rows.push([item.mfg, item.whse||'', item.desc, item.pk, item.unitPrice.toFixed(2), item.qty, item.lineTotal.toFixed(2)]);
    });
    rows.push([]);
    rows.push(['','','','','Subtotal:','','$'+po.subtotal.toFixed(2)]);
    
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:12},{wch:10},{wch:35},{wch:8},{wch:10},{wch:6},{wch:12}];
    const safeName = (po.code+' '+po.name).substring(0,31);
    XLSX.utils.book_append_sheet(wb, ws, safeName);
  });
  
  const sumRows = [['Blish-Mize Fall 2026 Drop Ship Order Summary'],
    ['PO#:', data.po, 'Ship Date:', data.shipDate],[]];
  sumRows.push(['Promo Code','Program','Items','Subtotal']);
  data.promoOrders.forEach(po => {
    sumRows.push([po.code, po.name, po.items.length, '$'+po.subtotal.toFixed(2)]);
  });
  sumRows.push([]);
  sumRows.push(['','GRAND TOTAL','', '$'+data.grandTotal.toFixed(2)]);
  const sumWs = XLSX.utils.aoa_to_sheet(sumRows);
  sumWs['!cols'] = [{wch:12},{wch:30},{wch:8},{wch:14}];
  XLSX.utils.book_append_sheet(wb, sumWs, 'Summary');
  
  const fn = 'BlishMize_DropShip'+(data.po?'_'+data.po:'')+'.xlsx';
  XLSX.writeFile(wb, fn.replace(/\s/g,'_'));
}

function exportPDF() {
  const data = getOrderData();
  if(data.grandItems===0){alert('No items ordered.');return;}
  
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF('p','pt','letter');
  const pageW = doc.internal.pageSize.getWidth();
  let y = 40;
  
  function drawSticker() {
    doc.setDrawColor(150);
    doc.setLineDash([3,3]);
    doc.rect(pageW-180, 15, 165, 40);
    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text('ATTACH DEALER STICKER', pageW-97, 39, {align:'center'});
    doc.setLineDash([]);
    doc.setTextColor(0);
  }
  
  drawSticker();
  
  doc.setFontSize(16);
  doc.setFont(undefined,'bold');
  doc.text('Blish-Mize Fall 2026 Drop Ship Order', 40, y);
  y += 18;
  doc.setFontSize(10);
  doc.setFont(undefined,'normal');
  if(data.po) { doc.text('PO#: '+data.po, 40, y); y+=14; }
  if(data.shipDate) { doc.text('Ship Date: '+data.shipDate, 40, y); y+=14; }
  doc.text('Billing: Through Blish-Mize', 40, y); y+=14;
  doc.text('Date: '+new Date().toLocaleDateString(), 40, y); y+=20;
  
  data.promoOrders.forEach((po, idx) => {
    if(y > 680) { doc.addPage(); drawSticker(); y = 40; }
    
    doc.setFontSize(12);
    doc.setFont(undefined,'bold');
    doc.text(po.code+' — '+po.name, 40, y);
    y += 14;
    doc.setFontSize(8);
    doc.setFont(undefined,'normal');
    doc.text('Valid: '+po.valid+' | Dating: '+po.dating+' | Min: $'+po.min_order, 40, y);
    y+=10;
    if(po.cs){doc.setFontSize(7);doc.text(po.code+' | '+(po.cs.t2||'')+' | '+(po.cs.cond||'')+' | '+(po.cs.must||'')+' | '+(po.cs.rsvd||''), 40, y);doc.setFontSize(8);}
    y += 12;
    
    const tableData = po.items.map(item => [
      item.mfg, item.whse||'', item.desc, item.pk,
      '$'+item.unitPrice.toFixed(2), item.qty, '$'+item.lineTotal.toFixed(2)
    ]);
    
    doc.autoTable({
      startY: y,
      head: [['Mfg#','Whse#','Description','Pk','Price','Qty','Total']],
      body: tableData,
      foot: [['','','','','Subtotal:','','$'+po.subtotal.toFixed(2)]],
      styles: {fontSize:8, cellPadding:3},
      headStyles: {fillColor:[26,26,26], fontSize:7},
      footStyles: {fillColor:[240,240,234], fontStyle:'bold'},
      columnStyles: {0:{cellWidth:50},1:{cellWidth:48},2:{cellWidth:180},3:{cellWidth:25,halign:'center'},
        4:{cellWidth:45,halign:'right'},5:{cellWidth:30,halign:'center'},6:{cellWidth:55,halign:'right'}},
      margin: {left:40, right:40},
      didDrawPage: function() { drawSticker(); },
    });
    y = doc.lastAutoTable.finalY + 20;
    
    // CS info block after table
    if(po.cs) {
      if(y > 730) { doc.addPage(); drawSticker(); y = 40; }
      doc.setFontSize(7);
      doc.setDrawColor(180);
      doc.line(40, y, pageW-40, y);
      y += 8;
      doc.text('Note: Coop and/or Distributor adders may apply to drop-ship orders. ACA PaintCare Recovery Fees may apply', 40, y);
      y += 16;
    }
  });
  
  if(y > 700) { doc.addPage(); drawSticker(); y = 40; }
  doc.setFontSize(14);
  doc.setFont(undefined,'bold');
  doc.text('Grand Total: $'+data.grandTotal.toFixed(2), pageW-40, y, {align:'right'});
  
  const fn = 'BlishMize_DropShip'+(data.po?'_'+data.po:'')+'.pdf';
  doc.save(fn.replace(/\s/g,'_'));
}
